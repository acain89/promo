services:
  # =========================
  # BACKEND (Node Web Service)
  # =========================
  - type: web
    name: pick3-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3001

      # Session (auto-generated secure secret)
      - key: SESSION_SECRET
        generateValue: true

      # Frontend URL (for CORS)
      - key: FRONTEND_URL
        value: https://p3d4-p19u.onrender.com

      # Stripe
      - key: STRIPE_SECRET_KEY
        value: REPLACE_ME
      - key: STRIPE_WEBHOOK_SECRET
        value: REPLACE_ME

      # Firebase / Firestore
      - key: FB_PROJECT_ID
        value: REPLACE_ME
      - key: FB_CLIENT_EMAIL
        value: REPLACE_ME
      - key: FB_PRIVATE_KEY
        value: REPLACE_ME

      # Admin auth (token-based)
      - key: ADMIN_CODE
        value: "893889"
      - key: ADMIN_TOKEN_SECRET
        value: iwanttobedonewiththissitesobadandiwantittomakealotofmoney

  # =========================
  # FRONTEND (Static Site)
  # =========================
  - type: static
    name: pick3-frontend
    rootDir: .
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE
        value: https://p3d4.onrender.com
